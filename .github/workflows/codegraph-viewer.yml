name: Codegraph Viewer
on:
  push:
    paths: ['packages/codegraph-viewer/**', '.github/workflows/codegraph-viewer.yml']
  pull_request:
    paths: ['packages/codegraph-viewer/**', '.github/workflows/codegraph-viewer.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/codegraph-viewer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run graph -- ../.. /tmp/codegraph.html
      - run: npm audit --audit-level=high
