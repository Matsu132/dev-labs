name: mcp-catalog-lint

on:
  push:
    paths:
      - 'packages/mcp-catalog-lint/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mcp-catalog-lint.yml'
  pull_request:
    paths:
      - 'packages/mcp-catalog-lint/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mcp-catalog-lint.yml'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --no-audit --ignore-scripts
      - name: ESLint
        run: npm run lint --workspace=mcp-catalog-lint
      - name: TypeScript type check
        run: npm run typecheck --workspace=mcp-catalog-lint
      - name: Build
        run: npm run build --workspace=mcp-catalog-lint
      - name: Unit tests
        run: npm run test:unit --workspace=mcp-catalog-lint
      - name: CLI smoke test
        working-directory: packages/mcp-catalog-lint
        run: node dist/cli.js examples/catalog.json
      - name: npm audit
        run: npm audit
