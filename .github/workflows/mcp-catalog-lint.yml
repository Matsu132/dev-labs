name: mcp-catalog-lint
on:
  push:
    paths:
      - 'packages/mcp-catalog-lint/**'
      - '.github/workflows/mcp-catalog-lint.yml'
  pull_request:
    paths:
      - 'packages/mcp-catalog-lint/**'
      - '.github/workflows/mcp-catalog-lint.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mcp-catalog-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npm run lint:example
