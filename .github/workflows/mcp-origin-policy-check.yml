name: mcp-origin-policy-check
on:
  push:
    paths:
      - 'packages/mcp-origin-policy-check/**'
      - '.github/workflows/mcp-origin-policy-check.yml'
  pull_request:
    paths:
      - 'packages/mcp-origin-policy-check/**'
      - '.github/workflows/mcp-origin-policy-check.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mcp-origin-policy-check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - run: npm install --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - run: node examples/check.mjs
