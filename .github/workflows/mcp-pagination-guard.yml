name: mcp-pagination-guard
on:
  push:
    paths:
      - 'packages/mcp-pagination-guard/**'
      - '.github/workflows/mcp-pagination-guard.yml'
  pull_request:
    paths:
      - 'packages/mcp-pagination-guard/**'
      - '.github/workflows/mcp-pagination-guard.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: packages/mcp-pagination-guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - run: node examples/check.mjs
